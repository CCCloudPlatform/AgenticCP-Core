# =============================================================================
# 알림 채널 설정
# =============================================================================
# 
# 디스코드, 텔레그램 등 새로운 채널 추가 시 이 설정만 변경하면 됩니다.
# 코드 수정 불필요!
#
# MVP: 현재는 SLACK만 사용 (단순)
# 확장: 나중에 DISCORD, EMAIL 등 추가 가능 (설정만 변경)

notification:
  channel:
    # 기본 채널 (매핑이 없을 때 사용)
    default: SLACK
    
    # 기본 관리자 사용자 ID (폴백용)
    # - 테넌트에 관리자가 없을 때만 사용
    # - 정상적으로는 각 테넌트의 TENANT_ADMIN 역할 사용자에게 알림 발송
    default-admin-user-id: 1
    
    # =========================================================================
    # 알림 타입별 채널 매핑
    # =========================================================================
    # MVP: 모두 SLACK 사용 (단순)
    # 확장: 나중에 타입별로 다른 채널 사용 가능
    mappings:
      ALERT: SLACK          # 임계값 위반 알림 → 슬랙
      SYSTEM: SLACK         # 시스템 알림 → 슬랙 (MVP: DISCORD로 변경 가능)
      SECURITY: SLACK       # 보안 알림 → 슬랙 (MVP: EMAIL로 변경 가능)
    
    # =========================================================================
    # 우선순위별 채널 매핑 (선택사항)
    # =========================================================================
    # MVP: 사용 안 함 (주석 처리)
    # 확장: 긴급도에 따라 다른 채널 사용 가능
    # priority-mappings:
    #   URGENT: SLACK       # 긴급 → 슬랙 (즉시 확인)
    #   HIGH: DISCORD       # 높음 → 디스코드
    #   MEDIUM: EMAIL       # 중간 → 이메일
    
    # =========================================================================
    # 폴백 채널 순서
    # =========================================================================
    # MVP: SLACK만 사용 (단순)
    # 확장: 나중에 여러 채널로 폴백 가능
    fallback-order:
      - SLACK
      # - DISCORD  # 나중에 추가
      # - EMAIL    # 나중에 추가

# =============================================================================
# 채널별 웹훅 설정
# =============================================================================

# 슬랙 웹훅 설정 (MVP 사용 중)
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/YOUR/WEBHOOK/URL}

# 디스코드 웹훅 설정 (나중에 추가 예정)
# discord:
#   webhook:
#     url: ${DISCORD_WEBHOOK_URL:https://discord.com/api/webhooks/YOUR/WEBHOOK/URL}

