spring:
  application:
    name: agenticcp-core

  profiles:
    active: local,notification
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/agenticcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:agenticcp}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  redis:
    enabled: false


security:
  jwt:
    # base64 인코딩된 256비트 이상 키를 사용하세요. 예시는 개발용입니다.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}

logging:
  mdc:
    enabled-keys: ["requestId", "tenantId", "clientIp"]
    request-id-type: "uuid"
    request-id-prefix: "req_"
    request-id-length: 8
    mask-client-ip: false
    mask-user-agent: false

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      cloud.aws.ec2.list:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      cloud.aws.ec2.list:
        maxAttempts: 3
        waitDuration: 200ms
  ratelimiter:
    instances:
      cloud.aws:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
  bulkhead:
    instances:
      cloud.aws:
        maxConcurrentCalls: 50

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/agenticcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: agenticcp
    password: agenticcppassword

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/agenticcp}
    username: ${DATABASE_USERNAME:agenticcp}
    password: ${DATABASE_PASSWORD:agenticcppassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false