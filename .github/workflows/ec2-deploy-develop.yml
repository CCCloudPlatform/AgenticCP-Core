name: Deploy to Develop EC2

on:
  push:
    branches: [develop, feature/cicd-ec2-setup]
  workflow_dispatch:

jobs:
  # 기존 CI 워크플로우 재사용
  test-and-build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # EC2 배포 (CI 성공 후 실행)
  deploy:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # EC2 연결 실패 시에도 워크플로우 계속
    
    steps:
    - name: Check EC2 Connection
      run: |
        echo "EC2 연결 확인 중..."
        # EC2 연결 테스트
        if timeout 10s bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22"; then
          echo "EC2 연결 성공"
          echo "EC2_READY=true" >> $GITHUB_ENV
        else
          echo "EC2 연결 실패 - EC2가 중지된 상태입니다"
          echo "EC2_READY=false" >> $GITHUB_ENV
        fi
        
    - name: Deploy to EC2
      if: env.EC2_READY == 'true'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 25m
        command_timeout: 25m
        script: |
          cd /opt/agenticcp-core
          git fetch origin
          # 현재 브랜치에 따라 배포
          if [ "${{ github.ref_name }}" = "develop" ]; then
            git reset --hard origin/develop
          elif [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            git reset --hard origin/feature/cicd-ec2-setup
          else
            git reset --hard origin/${{ github.ref_name }}
          fi
          
          # Docker 상태 확인
          echo "=== Docker 상태 확인 ==="
          docker --version
          docker-compose --version
          docker ps -a
          
          # 기존 컨테이너 정리
          echo "=== 기존 컨테이너 정리 ==="
          docker-compose down --volumes --remove-orphans || true
          
          # Docker 시스템 정리
          echo "=== Docker 시스템 정리 ==="
          docker system prune -f || true
          
          # Maven 및 Java 확인 (EC2에 직접 설치됨)
          echo "=== Maven 및 Java 확인 ==="
          echo "Java 버전: $(java --version | head -1)"
          mvn --version
          
          # JAVA_HOME 설정
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME 설정: $JAVA_HOME"
          
          # Maven 캐시 디렉토리 생성
          echo "=== Maven 캐시 설정 ==="
          mkdir -p ~/.m2
          
          
          # 1. 변경사항 분석
          echo "=== 변경사항 분석 ==="
          if git diff --name-only HEAD~1 HEAD | grep -qE "\.(java|xml|yml|yaml|properties)$"; then
            echo "소스 코드 변경 감지"
            SOURCE_CHANGED=true
          else
            echo "소스 코드 변경 없음"
            SOURCE_CHANGED=false
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -qE "(Dockerfile|docker-compose\.yml|pom\.xml)$"; then
            echo "인프라/의존성 변경 감지"
            INFRA_CHANGED=true
          else
            echo "인프라/의존성 변경 없음"
            INFRA_CHANGED=false
          fi
          
          # 2. 기존 이미지 확인
          IMAGE_EXISTS=false
          # docker-compose가 생성하는 이미지 이름 확인
          if docker images | grep -qE "(agenticcp-core.*app|.*agenticcp.*app)"; then
            echo "기존 Docker 이미지 발견"
            IMAGE_EXISTS=true
          else
            echo "기존 Docker 이미지 없음"
          fi
          
          # 3. 배포 전략 결정
          if [ "$INFRA_CHANGED" = "true" ]; then
            echo "=== 인프라 변경: 스마트 Docker 이미지 재빌드 ==="
            # pom.xml 변경 시에만 --no-cache, 나머지는 캐시 활용
            if git diff --name-only HEAD~1 HEAD | grep -q "pom\.xml"; then
              echo "pom.xml 변경 감지: 완전 재빌드"
              docker-compose build --no-cache app
            else
              echo "인프라 설정 변경: 캐시 활용 빌드"
              docker-compose build app
            fi
            docker-compose up -d app
          elif [ "$IMAGE_EXISTS" = "false" ]; then
            echo "=== 첫 배포: 빠른 이미지 생성 ==="
            # 전략: Maven으로 JAR 빌드 후, 간단한 이미지 생성
            echo "Maven 빌드 시작..."
            if timeout 300 mvn clean package -DskipTests -q -Dmaven.compiler.source=17 -Dmaven.compiler.target=17; then
              echo "Maven 빌드 성공"
              # Dockerfile 임시 백업 및 간단한 버전 생성
              cp Dockerfile Dockerfile.backup
              
              # 간단한 Dockerfile 생성 (빌드 스테이지 제거, JAR만 복사)
              echo 'FROM eclipse-temurin:17-jre' > Dockerfile
              echo 'RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*' >> Dockerfile
              echo 'WORKDIR /app' >> Dockerfile
              echo 'COPY target/*.jar app.jar' >> Dockerfile
              echo 'RUN groupadd -r agenticcp && useradd -r -g agenticcp agenticcp' >> Dockerfile
              echo 'RUN mkdir -p /app/logs && chown -R agenticcp:agenticcp /app' >> Dockerfile
              echo 'USER agenticcp' >> Dockerfile
              echo 'EXPOSE 8080' >> Dockerfile
              echo 'HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 CMD curl -f http://localhost:8080/api/health || exit 1' >> Dockerfile
              echo 'ENTRYPOINT ["java", "-jar", "app.jar"]' >> Dockerfile
              
              # 간단한 이미지 빌드 (캐시만 다운로드, 1-2분)
              timeout 240 docker-compose build app || {
                echo "빌드 실패, 원래 Dockerfile로 재시도"
                mv Dockerfile.backup Dockerfile
                docker-compose build app
              }
              docker-compose up -d app
              
              # Dockerfile 복구 (다음 배포를 위해)
              if [ -f Dockerfile.backup ]; then
                echo "Dockerfile 복구 중..."
                mv Dockerfile.backup Dockerfile
              fi
            else
              echo "Maven 빌드 실패, 원래 Dockerfile로 빌드"
              docker-compose build app
              docker-compose up -d app
            fi
          elif [ "$SOURCE_CHANGED" = "true" ]; then
            echo "=== 소스 변경: Maven 빌드 후 JAR 교체 ==="
            # Maven으로 JAR 빌드 (Ubuntu 22.04 LTS)
            echo "Maven 빌드 시작..."
            echo "Maven 빌드용 JAVA_HOME: $JAVA_HOME"
            
            # Maven 빌드 실행 (타임아웃 5분 설정)
            if timeout 300 mvn clean package -DskipTests -q -Dmaven.compiler.source=17 -Dmaven.compiler.target=17; then
              echo "Maven 빌드 성공"
              MAVEN_BUILD_SUCCESS=true
            else
              echo "Maven 빌드 실패 또는 타임아웃, 기존 컨테이너만 재시작"
              MAVEN_BUILD_SUCCESS=false
            fi
            
            # Maven 빌드 성공 시에만 JAR 교체
            if [ "$MAVEN_BUILD_SUCCESS" = "true" ]; then
              echo "JAR 파일 교체 중..."
              docker-compose stop app || true
              
              # 컨테이너가 없으면 기존 이미지로 생성, 있으면 JAR 교체
              if docker ps -aq --filter "name=agenticcp-app" | grep -q .; then
                echo "기존 컨테이너에서 JAR 파일 교체"
                docker-compose start app
                sleep 3
                docker ps -q --filter "name=agenticcp-app" | head -1 | xargs -I {} docker cp target/*.jar {}:/app/app.jar
                docker-compose restart app
              else
                echo "기존 이미지로 컨테이너 생성 후 JAR 교체"
                docker-compose up -d app
                sleep 5
                docker ps -q --filter "name=agenticcp-app" | head -1 | xargs -I {} docker cp target/*.jar {}:/app/app.jar
                docker-compose restart app
              fi
            else
              echo "컨테이너만 재시작 (빌드 없음)"
              docker-compose up -d app
            fi
          else
            echo "=== 변경사항 없음: 컨테이너만 재시작 ==="
            docker-compose up -d app
          fi
          
          # 빌드 실패 시 강제 재빌드 (인프라 변경 시에만)
          if [ "$INFRA_CHANGED" = "true" ] && [ $? -ne 0 ]; then
            echo "빌드 실패, 강제 재빌드 실행"
            docker-compose build --no-cache --pull app
            docker-compose up -d app
          fi
          
          # 컨테이너 상태 확인
          echo "=== 컨테이너 상태 확인 ==="
          docker ps -a
          
          # 애플리케이션 로그 확인
          echo "=== 애플리케이션 로그 (최근 50줄) ==="
          docker-compose logs app | tail -50
          
          # 헬스체크 대기 및 재시도
          echo "=== 헬스체크 시작 (최대 2분 대기) ==="
          for i in {1..24}; do
            echo "시도 $i/24..."
            if curl -f http://localhost:8080/api/health 2>/dev/null; then
              echo "헬스체크 성공!"
              exit 0
            fi
            sleep 5
          done
          
          echo "헬스체크 실패 - 애플리케이션 로그 확인"
          docker-compose logs app
          exit 1