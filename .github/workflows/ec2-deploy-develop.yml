name: Deploy to Develop EC2

on:
  push:
    branches: [develop, feature/cicd-ec2-setup]
  workflow_dispatch:

jobs:
  # 기존 CI 워크플로우 재사용
  test-and-build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # EC2 배포 (CI 성공 후 실행)
  deploy:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/agenticcp-core
          git fetch origin
          # 현재 브랜치에 따라 배포
          if [ "${{ github.ref_name }}" = "develop" ]; then
            git reset --hard origin/develop
          elif [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            git reset --hard origin/feature/cicd-ec2-setup
          else
            git reset --hard origin/${{ github.ref_name }}
          fi
          
          # Docker 상태 확인
          echo "=== Docker 상태 확인 ==="
          docker --version
          docker-compose --version
          docker ps -a
          
          # 기존 컨테이너 정리
          echo "=== 기존 컨테이너 정리 ==="
          docker-compose down --volumes --remove-orphans || true
          
          # Docker 시스템 정리
          echo "=== Docker 시스템 정리 ==="
          docker system prune -f || true
          
          # 이미지 빌드 전략 결정
          echo "=== 이미지 빌드 전략 결정 ==="
          if [ "${{ github.ref_name }}" = "develop" ] || [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            echo "${{ github.ref_name }} 브랜치: 코드 변경사항 반영을 위해 새로 빌드"
            docker-compose build --no-cache app
          elif docker images | grep -q "agenticcp-core"; then
            echo "기존 이미지 발견, 업데이트 빌드"
            docker-compose build app
          else
            echo "이미지 없음, 새로 빌드"
            docker-compose build --no-cache app
          fi
          
          # 빌드 실패 시 강제 재빌드
          if [ $? -ne 0 ]; then
            echo "빌드 실패, 강제 재빌드 실행"
            docker-compose build --no-cache --pull app
          fi
          
          # 컨테이너 재시작
          echo "=== 컨테이너 재시작 ==="
          docker-compose up -d app
          
          # 컨테이너 상태 확인
          echo "=== 컨테이너 상태 확인 ==="
          docker ps -a
          docker-compose logs app
          
          sleep 30
          
          # 헬스체크
          echo "=== 헬스체크 ==="
          curl -f http://localhost:8080/api/health || exit 1