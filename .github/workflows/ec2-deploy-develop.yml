name: Deploy to Develop EC2

on:
  push:
    branches: [develop, feature/cicd-ec2-setup]
  workflow_dispatch:

jobs:
  # 기존 CI 워크플로우 재사용
  test-and-build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # EC2 배포 (CI 성공 후 실행)
  deploy:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 50m
        script: |
          cd /opt/agenticcp-core
          git fetch origin
          # 현재 브랜치에 따라 배포
          if [ "${{ github.ref_name }}" = "develop" ]; then
            git reset --hard origin/develop
          elif [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            git reset --hard origin/feature/cicd-ec2-setup
          else
            git reset --hard origin/${{ github.ref_name }}
          fi
          
          # Docker 상태 확인
          echo "=== Docker 상태 확인 ==="
          docker --version
          docker-compose --version
          docker ps -a
          
          # 기존 컨테이너 정리
          echo "=== 기존 컨테이너 정리 ==="
          docker-compose down --volumes --remove-orphans || true
          
          # Docker 시스템 정리
          echo "=== Docker 시스템 정리 ==="
          docker system prune -f || true
          
          # Maven 설치 (한 번만 설치)
          echo "=== Maven 설치 확인 ==="
          if ! command -v mvn &> /dev/null; then
            echo "Maven 설치 중..."
            sudo apt-get update -qq
            sudo apt-get install -y maven
            echo "Maven 설치 완료: $(mvn --version | head -1)"
          else
            echo "Maven 이미 설치됨: $(mvn --version | head -1)"
          fi
          
          # Maven 설정 최적화
          echo "=== Maven 설정 최적화 ==="
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>aliyun-maven</id>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/central</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>fast-download</id>
                <properties>
                  <maven.wagon.http.retryHandler.count>3</maven.wagon.http.retryHandler.count>
                  <maven.wagon.http.retryHandler.requestSentEnabled>true</maven.wagon.http.retryHandler.requestSentEnabled>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>fast-download</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          
          # 1. 변경사항 분석
          echo "=== 변경사항 분석 ==="
          if git diff --name-only HEAD~1 HEAD | grep -qE "\.(java|xml|yml|yaml|properties)$"; then
            echo "소스 코드 변경 감지"
            SOURCE_CHANGED=true
          else
            echo "소스 코드 변경 없음"
            SOURCE_CHANGED=false
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -qE "(Dockerfile|docker-compose\.yml|pom\.xml)$"; then
            echo "인프라/의존성 변경 감지"
            INFRA_CHANGED=true
          else
            echo "인프라/의존성 변경 없음"
            INFRA_CHANGED=false
          fi
          
          # 2. 배포 전략 결정
          if [ "$INFRA_CHANGED" = "true" ]; then
            echo "=== 인프라 변경: 스마트 Docker 이미지 재빌드 ==="
            # pom.xml 변경 시에만 --no-cache, 나머지는 캐시 활용
            if git diff --name-only HEAD~1 HEAD | grep -q "pom\.xml"; then
              echo "pom.xml 변경 감지: 완전 재빌드"
              docker-compose build --no-cache app
            else
              echo "인프라 설정 변경: 캐시 활용 빌드"
              docker-compose build app
            fi
            docker-compose up -d app
          elif [ "$SOURCE_CHANGED" = "true" ]; then
            echo "=== 소스 변경: JAR 파일 교체 ==="
            # Maven 실행 (호스트에서 직접 실행)
            echo "Maven 빌드 시작..."
            if mvn clean package -DskipTests -q -T 4C; then
              echo "Maven 빌드 성공"
              
              # JAR 파일만 교체 (Docker 이미지 재빌드 없이)
              echo "JAR 파일 교체 중..."
              docker-compose stop app || true
              if docker ps -q --filter "name=agenticcp-app" | head -1 | xargs -I {} docker cp target/*.jar {}:/app/app.jar; then
                echo "JAR 파일 교체 성공"
                docker-compose up -d app
              else
                echo "JAR 파일 교체 실패, 컨테이너 재생성"
                docker-compose build app
                docker-compose up -d app
              fi
            else
              echo "Maven 빌드 실패, Docker 이미지 재빌드"
              docker-compose build app
              docker-compose up -d app
            fi
          else
            echo "=== 변경사항 없음: 컨테이너만 재시작 ==="
            docker-compose up -d app
          fi
          
          # 빌드 실패 시 강제 재빌드 (인프라 변경 시에만)
          if [ "$INFRA_CHANGED" = "true" ] && [ $? -ne 0 ]; then
            echo "빌드 실패, 강제 재빌드 실행"
            docker-compose build --no-cache --pull app
            docker-compose up -d app
          fi
          
          # 컨테이너 상태 확인
          echo "=== 컨테이너 상태 확인 ==="
          docker ps -a
          docker-compose logs app
          
          sleep 30
          
          # 헬스체크
          echo "=== 헬스체크 ==="
          curl -f http://localhost:8080/api/health || exit 1