name: Deploy to Develop EC2

on:
  push:
    branches: [develop, feature/cicd-ec2-setup]
  workflow_dispatch:

jobs:
  # 기존 CI 워크플로우 재사용
  test-and-build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # EC2 배포 (CI 성공 후 실행)
  deploy:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /opt/agenticcp-core
          git fetch origin
          # 현재 브랜치에 따라 배포
          if [ "${{ github.ref_name }}" = "develop" ]; then
            git reset --hard origin/develop
          elif [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            git reset --hard origin/feature/cicd-ec2-setup
          else
            git reset --hard origin/${{ github.ref_name }}
          fi
          
          # Docker 상태 확인
          echo "=== Docker 상태 확인 ==="
          docker --version
          docker-compose --version
          docker ps -a
          
          # 기존 컨테이너 정리
          echo "=== 기존 컨테이너 정리 ==="
          docker-compose down --volumes --remove-orphans || true
          
          # Docker 시스템 정리
          echo "=== Docker 시스템 정리 ==="
          docker system prune -f || true
          
          # Maven은 Docker 컨테이너에 설치되어 있음
          echo "=== Maven 확인 ==="
          echo "Maven은 Docker 컨테이너에 설치되어 있습니다."
          
          
          # 1. 변경사항 분석
          echo "=== 변경사항 분석 ==="
          if git diff --name-only HEAD~1 HEAD | grep -qE "\.(java|xml|yml|yaml|properties)$"; then
            echo "소스 코드 변경 감지"
            SOURCE_CHANGED=true
          else
            echo "소스 코드 변경 없음"
            SOURCE_CHANGED=false
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -qE "(Dockerfile|docker-compose\.yml|pom\.xml)$"; then
            echo "인프라/의존성 변경 감지"
            INFRA_CHANGED=true
          else
            echo "인프라/의존성 변경 없음"
            INFRA_CHANGED=false
          fi
          
          # 2. 배포 전략 결정
          if [ "$INFRA_CHANGED" = "true" ]; then
            echo "=== 인프라 변경: Docker 이미지 재빌드 ==="
            docker-compose build --no-cache app
            docker-compose up -d app
          elif [ "$SOURCE_CHANGED" = "true" ]; then
            echo "=== 소스 변경: JAR 빌드 후 교체 ==="
            # Docker 컨테이너에서 Maven 실행
            docker run --rm -v $(pwd):/app -w /app maven:3.9-openjdk-17 mvn clean package -DskipTests -q
            # 기존 컨테이너 중지
            docker-compose stop app || true
            # JAR 파일 교체
            if docker ps -q --filter "name=agenticcp-app" | head -1 | xargs -I {} docker cp target/*.jar {}:/app/app.jar; then
              echo "JAR 파일 교체 성공"
            else
              echo "JAR 파일 교체 실패, 컨테이너 재생성"
              docker-compose up -d app
              sleep 10
              docker ps -q --filter "name=agenticcp-app" | head -1 | xargs -I {} docker cp target/*.jar {}:/app/app.jar
            fi
            # 컨테이너 재시작
            docker-compose up -d app
          else
            echo "=== 변경사항 없음: 컨테이너만 재시작 ==="
            docker-compose up -d app
          fi
          
          # 빌드 실패 시 강제 재빌드
          if [ $? -ne 0 ]; then
            echo "빌드 실패, 강제 재빌드 실행"
            docker-compose build --no-cache --pull app
          fi
          
          # 컨테이너 재시작
          echo "=== 컨테이너 재시작 ==="
          docker-compose up -d app
          
          # 컨테이너 상태 확인
          echo "=== 컨테이너 상태 확인 ==="
          docker ps -a
          docker-compose logs app
          
          sleep 30
          
          # 헬스체크
          echo "=== 헬스체크 ==="
          curl -f http://localhost:8080/api/health || exit 1