name: Deploy to EC2 (Simple - Local Build)

on:
  push:
    branches: [develop, feature/cicd-ec2-setup]
  workflow_dispatch:

jobs:
  # CI 및 빌드
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: mvn clean test
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_REDIS_HOST: 127.0.0.1
        SPRING_REDIS_PORT: 6379

    - name: Build JAR
      run: mvn clean package -DskipTests

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: agenticcp-jar
        path: target/*.jar

  # EC2 배포
  deploy:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: agenticcp-jar
        path: ./artifact

    - name: Check EC2 Connection
      run: |
        echo "EC2 연결 확인 중..."
        if timeout 10s bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22"; then
          echo "EC2 연결 성공"
          echo "EC2_READY=true" >> $GITHUB_ENV
        else
          echo "EC2 연결 실패 - EC2가 중지된 상태입니다"
          echo "EC2_READY=false" >> $GITHUB_ENV
        fi
        
    - name: Deploy to EC2
      if: env.EC2_READY == 'true'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "./artifact/*.jar"
        target: "/tmp/"

    - name: Restart on EC2
      if: env.EC2_READY == 'true'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 10m
        script: |
          cd /opt/agenticcp-core
          
          # 최신 코드 pull
          git fetch origin
          if [ "${{ github.ref_name }}" = "develop" ]; then
            git reset --hard origin/develop
          elif [ "${{ github.ref_name }}" = "feature/cicd-ec2-setup" ]; then
            git reset --hard origin/feature/cicd-ec2-setup
          else
            git reset --hard origin/${{ github.ref_name }}
          fi
          
          # JAR 파일을 target 디렉토리로 복사
          mkdir -p target
          cp /tmp/*.jar target/
          rm -f /tmp/*.jar
          
          # Docker 상태 확인
          echo "=== Docker 상태 확인 ==="
          docker ps -a
          
          # 기존 컨테이너 중지
          echo "=== 기존 컨테이너 중지 ==="
          docker-compose stop app || true
          
          # Maven 빌드 없이 바로 Docker 이미지 빌드 (JAR만 사용)
          echo "=== Docker 이미지 빌드 ==="
          
          # Dockerfile 백업
          cp Dockerfile Dockerfile.backup
          
          # 간단한 Dockerfile 생성 (빌드 없이 JAR만 사용)
          cat > Dockerfile <<'EOF'
          FROM eclipse-temurin:17-jre
          
          RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /app
          
          COPY target/*.jar app.jar
          
          RUN groupadd -r agenticcp && useradd -r -g agenticcp agenticcp
          RUN mkdir -p /app/logs && chown -R agenticcp:agenticcp /app
          
          USER agenticcp
          
          EXPOSE 8080
          
          HEALTHCHECK --interval=30s --timeout=3s --start-period=40s --retries=3 \
            CMD curl -f http://localhost:8080/api/actuator/health || exit 1
          
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          
          # Docker 이미지 빌드
          docker-compose build app
          
          # 컨테이너 시작
          docker-compose up -d app
          
          # Dockerfile 복구
          mv Dockerfile.backup Dockerfile
          
          # 컨테이너 상태 확인
          echo "=== 컨테이너 상태 확인 ==="
          docker ps -a
          
          # 애플리케이션 로그 확인
          echo "=== 애플리케이션 로그 (최근 50줄) ==="
          sleep 5
          docker-compose logs app | tail -50
          
          # 헬스체크 대기
          echo "=== 헬스체크 시작 (최대 2분 대기) ==="
          for i in {1..24}; do
            echo "시도 $i/24..."
            if curl -f http://localhost:8080/api/actuator/health 2>/dev/null; then
              echo "헬스체크 성공!"
              exit 0
            fi
            sleep 5
          done
          
          echo "헬스체크 실패 - 애플리케이션 로그 확인"
          docker-compose logs app
          exit 1

